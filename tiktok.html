<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TikTok connected | GTA 6 Moments</title>
<style>body{font-family:system-ui,sans-serif;max-width:640px;margin:48px auto;padding:0 20px;line-height:1.6;color:#222}
code{display:block;word-break:break-all;background:#f3f3f3;padding:12px;border-radius:6px;font-size:15px}
button{margin-top:10px;padding:8px 14px;font-size:15px}</style></head><body>
<h1>TikTok connected</h1>
<p id="msg">Copy this code and paste it into the Terminal window that asked for it:</p>
<code id="code">(no code in this link)</code>
<button onclick="navigator.clipboard.writeText(document.getElementById('code').innerText)">Copy code</button>
<script>
const p=new URLSearchParams(location.search);
if(p.get('code')) document.getElementById('code').innerText=p.get('code');
if(p.get('error')) document.getElementById('msg').innerText='TikTok said: '+p.get('error')+' '+(p.get('error_description')||'');
</script>
</body></html>
